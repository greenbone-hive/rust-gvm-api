name: E2E

on:
  merge_group:
    types: [checks_requested]
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"
  push:
    branches: [main, devel]
  pull_request:
    branches: [main, devel]

concurrency:
  group: e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  GVM_GATEWAY_E2E_BASE_URL: http://127.0.0.1:8080
  GVM_GATEWAY_E2E_USERNAME: admin
  GVM_GATEWAY_E2E_PASSWORD: admin
  GVM_GATEWAY_E2E_TARGET_HOST: openvasd
  GVM_GATEWAY_E2E_READY_TIMEOUT_SECS: "120"
  GVM_GATEWAY_E2E_RESOURCE_TIMEOUT_SECS: "1200"
  GVM_GATEWAY_E2E_SCAN_TIMEOUT_SECS: "900"
  GVM_GATEWAY_E2E_POLL_INTERVAL_SECS: "10"

jobs:
  classify-changes:
    name: Classify Changes
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
      e2e_required: ${{ steps.classify.outputs.e2e_required }}
      target_branch: ${{ steps.classify.outputs.target_branch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Classify changed files
        id: classify
        env:
          TARGET_BRANCH: ${{ github.base_ref || github.event.merge_group.base_ref || github.ref_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: .github/scripts/classify-ci-changes.sh

  rest-discovery-scan:
    name: REST Discovery Scan E2E
    needs: classify-changes
    if: needs.classify-changes.outputs.e2e_required == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Rust
        uses: greenbone/actions/setup-rust@d6d4c9500cb4e83f8a516ec1d40b04bcc720bd22 # v3
        with:
          rust-version: stable
          components: rustfmt
          cache-key: cargo-e2e-rest-discovery-${{ runner.os }}-${{ runner.arch }}-stable-${{ hashFiles('**/Cargo.lock') }}
      - name: Start compose-backed runtime
        run: ./scripts/compose-dev.sh up -d --build
      - name: Capture exact E2E runtime provenance
        if: always()
        run: |
          mkdir -p dist/e2e
          python3 scripts/capture-e2e-provenance.py --output dist/e2e/provenance.json \
            2>&1 | tee dist/e2e/provenance-capture.log
      - name: Run REST discovery-scan E2E suite
        run: ./scripts/run-e2e-tests.sh
      - name: Capture compose diagnostics
        if: always()
        run: |
          mkdir -p dist/e2e
          ./scripts/compose-dev.sh ps > dist/e2e/compose-ps.txt || true
          ./scripts/compose-dev.sh logs --no-color > dist/e2e/compose.log || true
      - name: Upload compose diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: e2e-compose-diagnostics
          path: dist/e2e/*
      - name: Tear down compose stack
        if: always()
        run: ./scripts/compose-dev.sh down -v

  direct-openvasd-shadow:
    name: Direct OpenVASD Shadow E2E (advisory)
    needs: classify-changes
    if: needs.classify-changes.outputs.e2e_required == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    permissions:
      contents: read
    env:
      GVM_GATEWAY_E2E_TARGET_HOST: e2e-target
      GVM_GATEWAY_E2E_SCANNER_BACKEND_IDENTITY: openvasd-backend
      GVM_GATEWAY_E2E_SCANNER_BACKEND_URL: http://127.0.0.1:8086
      GVM_GATEWAY_E2E_EXPECTED_SCANNER_SCENARIO: success
      GVM_GATEWAY_E2E_RUN_SCOPE: ${{ github.run_id }}-${{ github.run_attempt }}-shadow
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Rust
        uses: greenbone/actions/setup-rust@d6d4c9500cb4e83f8a516ec1d40b04bcc720bd22 # v3
        with:
          rust-version: "1.98.1"
          components: rustfmt
          cache-key: cargo-e2e-direct-openvasd-${{ runner.os }}-${{ runner.arch }}-1.98.1-${{ hashFiles('**/Cargo.lock') }}
      - name: Fetch pinned OpenVASD fixtures
        run: python3 scripts/fetch-openvasd-emulator-fixtures.py
      - name: Start direct-OpenVASD shadow runtime
        id: start_runtime
        run: ./scripts/compose-direct-openvasd.sh up -d --build
      - name: Verify direct-OpenVASD readiness and identities
        id: readiness
        run: ./scripts/run-e2e-tests.sh --wait-only
      - name: Capture exact direct-OpenVASD provenance
        run: |
          mkdir -p dist/e2e-openvasd/raw
          python3 scripts/capture-e2e-provenance.py \
            --lane direct-openvasd \
            --output dist/e2e-openvasd/raw/provenance.json
      - name: Run all named community contracts
        id: contracts
        run: |
          mkdir -p dist/e2e-openvasd/raw
          set -o pipefail
          ./scripts/run-direct-openvasd-contracts.sh \
            2>&1 | tee dist/e2e-openvasd/raw/cargo.log
      - name: Exercise scanner failure mappings
        id: faults
        if: always() && steps.readiness.outcome == 'success'
        run: |
          mkdir -p dist/e2e-openvasd/raw
          set -o pipefail
          ./scripts/run-openvasd-fault-mappings.sh \
            2>&1 | tee dist/e2e-openvasd/raw/faults.log
      - name: Check direct-OpenVASD application state
        if: always() && steps.start_runtime.outcome == 'success'
        run: ./scripts/check-direct-openvasd-runtime.sh dist/e2e-openvasd/raw
      - name: Capture bounded direct-OpenVASD diagnostics
        if: always()
        run: ./scripts/capture-direct-openvasd-diagnostics.sh dist/e2e-openvasd/raw
      - name: Tear down direct-OpenVASD shadow runtime
        if: always()
        run: ./scripts/compose-direct-openvasd.sh down -v --remove-orphans
      - name: Upload raw direct-OpenVASD evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: e2e-direct-openvasd-shadow-raw
          path: dist/e2e-openvasd/raw/*
          if-no-files-found: error
          retention-days: 30

  direct-openvasd-shadow-evidence:
    name: Direct OpenVASD Shadow Evidence (advisory)
    if: >-
      always() &&
      needs.classify-changes.outputs.e2e_required == 'true'
    needs: [classify-changes, rest-discovery-scan, direct-openvasd-shadow]
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download raw direct-OpenVASD evidence
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: e2e-direct-openvasd-shadow-raw
          path: dist/e2e-openvasd/raw
      - name: Finalize Phase 0 evidence
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist/e2e-openvasd/raw dist/e2e-openvasd/final
          python3 scripts/finalize-openvasd-evidence.py \
            --raw-dir dist/e2e-openvasd/raw \
            --output-dir dist/e2e-openvasd/final \
            --job-name "Direct OpenVASD Shadow E2E (advisory)" \
            --osp-job-name "REST Discovery Scan E2E" \
            --raw-artifact e2e-direct-openvasd-shadow-raw
      - name: Upload finalized direct-OpenVASD evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: e2e-direct-openvasd-shadow-evidence
          path: |
            dist/e2e-openvasd/final/*
            dist/e2e-openvasd/raw/provenance.json
          if-no-files-found: error
          retention-days: 30

  rest-discovery-scan-main-gate:
    name: REST Discovery Scan E2E (main)
    if: >-
      always() &&
      ((github.event_name == 'pull_request' && github.base_ref == 'main') ||
       (github.event_name == 'merge_group' && github.event.merge_group.base_ref == 'refs/heads/main') ||
       (github.event_name != 'pull_request' && github.event_name != 'merge_group' && github.ref_name == 'main'))
    needs: [classify-changes, rest-discovery-scan]
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate main E2E gate
        run: |
          echo "docs_only=${{ needs.classify-changes.outputs.docs_only }}"
          echo "e2e_required=${{ needs.classify-changes.outputs.e2e_required }}"
          echo "scan_result=${{ needs.rest-discovery-scan.result }}"

          if [[ "${{ needs.classify-changes.result }}" != "success" ]]; then
            echo "Change classification failed; failing closed." >&2
            exit 1
          fi

          if [[ "${{ needs.classify-changes.outputs.e2e_required }}" != "true" ]]; then
            echo "Docs-only change; expensive E2E scan is not required."
            exit 0
          fi

          if [[ "${{ needs.rest-discovery-scan.result }}" == "success" ]]; then
            echo "Main E2E scan passed."
            exit 0
          fi

          echo "Main E2E scan did not pass." >&2
          exit 1

  rest-discovery-scan-devel-gate:
    name: REST Discovery Scan E2E (devel)
    if: >-
      always() &&
      ((github.event_name == 'pull_request' && github.base_ref == 'devel') ||
       (github.event_name == 'merge_group' && github.event.merge_group.base_ref == 'refs/heads/devel') ||
       (github.event_name != 'pull_request' && github.event_name != 'merge_group' && github.ref_name == 'devel'))
    needs: [classify-changes, rest-discovery-scan]
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate devel E2E gate
        run: |
          echo "docs_only=${{ needs.classify-changes.outputs.docs_only }}"
          echo "e2e_required=${{ needs.classify-changes.outputs.e2e_required }}"
          echo "scan_result=${{ needs.rest-discovery-scan.result }}"

          if [[ "${{ needs.classify-changes.result }}" != "success" ]]; then
            echo "Change classification failed; failing closed." >&2
            exit 1
          fi

          if [[ "${{ needs.classify-changes.outputs.e2e_required }}" != "true" ]]; then
            echo "Docs-only change; expensive E2E scan is not required."
            exit 0
          fi

          if [[ "${{ needs.rest-discovery-scan.result }}" == "success" ]]; then
            echo "Devel E2E scan passed."
            exit 0
          fi

          echo "Devel E2E scan did not pass." >&2
          exit 1
