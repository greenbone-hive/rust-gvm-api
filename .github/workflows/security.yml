name: Security

on:
  merge_group:
    types: [checks_requested]
  push:
    branches: [main, next]
    paths-ignore:
      - 'docs/**'
      - 'spec/**'
      - '*.md'
      - 'LICENSE'
      - '.github/ISSUE_TEMPLATE/**'
  pull_request:
    # Keep this required workflow active for both protected delivery lanes.
    branches: [main, next]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_AUDIT_VERSION: "0.22.2"
  CARGO_CYCLONEDX_VERSION: "0.5.9"
  CARGO_GEIGER_VERSION: "0.13.0"
  CARGO_MACHETE_VERSION: "0.9.2"
  CARGO_VET_VERSION: "0.10.2"
  SBOMQS_VERSION: "v2.0.5"
  SBOM_QUALITY_THRESHOLD: "8.3"

jobs:
  cargo-audit:
    name: Cargo Audit
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Rust
        uses: greenbone/actions/setup-rust@d6d4c9500cb4e83f8a516ec1d40b04bcc720bd22 # v3
        with:
          rust-version: stable
          components: rustfmt
          cache-key: cargo-security-audit-${{ runner.os }}-${{ runner.arch }}-stable-${{ env.CARGO_AUDIT_VERSION }}-${{ hashFiles('**/Cargo.lock') }}
      - name: Install pinned cargo-audit
        run: cargo install cargo-audit --version "${CARGO_AUDIT_VERSION}" --locked
      - name: Run cargo-audit
        run: cargo audit

  cargo-machete:
    name: Unused Dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Rust
        uses: greenbone/actions/setup-rust@d6d4c9500cb4e83f8a516ec1d40b04bcc720bd22 # v3
        with:
          rust-version: stable
          components: rustfmt
          cache-key: cargo-security-machete-${{ runner.os }}-${{ runner.arch }}-stable-${{ env.CARGO_MACHETE_VERSION }}-${{ hashFiles('**/Cargo.lock') }}
      - name: Install pinned cargo-machete
        run: cargo install cargo-machete --version "${CARGO_MACHETE_VERSION}" --locked
      - name: Run cargo-machete
        run: cargo machete

  cargo-vet:
    name: Cargo Vet
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Rust
        uses: greenbone/actions/setup-rust@d6d4c9500cb4e83f8a516ec1d40b04bcc720bd22 # v3
        with:
          rust-version: stable
          components: rustfmt
          cache-key: cargo-security-vet-${{ runner.os }}-${{ runner.arch }}-stable-${{ env.CARGO_VET_VERSION }}-${{ hashFiles('**/Cargo.lock') }}
      - name: Install pinned cargo-vet
        run: cargo install cargo-vet --version "${CARGO_VET_VERSION}" --locked
      - name: Require committed dependency review evidence
        run: cargo vet --locked

  security-policy:
    name: Security Policy Tests
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Rust
        uses: greenbone/actions/setup-rust@d6d4c9500cb4e83f8a516ec1d40b04bcc720bd22 # v3
        with:
          rust-version: stable
          components: rustfmt
          cache-key: cargo-security-policy-${{ runner.os }}-${{ runner.arch }}-stable-${{ hashFiles('**/Cargo.lock') }}
      - name: Test fail-closed security helpers and workflow policy
        run: >-
          python3 -B -m unittest
          tests.test_sbom_postprocess
          tests.test_sbom_quality
          tests.test_workspace_security
          tests.test_security_workflow
          -q

  sbom-quality:
    name: SBOM Quality
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Rust
        uses: greenbone/actions/setup-rust@d6d4c9500cb4e83f8a516ec1d40b04bcc720bd22 # v3
        with:
          rust-version: stable
          components: rustfmt
          cache-key: cargo-security-sbom-${{ runner.os }}-${{ runner.arch }}-stable-${{ env.CARGO_CYCLONEDX_VERSION }}-${{ hashFiles('**/Cargo.lock') }}
      - name: Install pinned cargo-cyclonedx
        run: cargo install cargo-cyclonedx --version "${CARGO_CYCLONEDX_VERSION}" --locked
      - name: Verify the locked all-feature workspace
        run: cargo metadata --locked --all-features --format-version 1 > /dev/null
      - name: Generate complete workspace CycloneDX JSON
        run: >-
          cargo cyclonedx --format json --all --all-features --target all
          --spec-version 1.5
      - name: Collect and post-process every workspace SBOM
        run: |
          python3 scripts/collect_workspace_sboms.py sbom-artifacts
          python3 scripts/sbom_postprocess.py \
            --cargo-toml Cargo.toml \
            --declare-dependency-complete \
            sbom-artifacts/*.cdx.json
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - name: Install pinned sbomqs
        run: |
          go install github.com/interlynk-io/sbomqs/v2@${SBOMQS_VERSION}
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Enforce SBOM quality floor
        run: |
          sbomqs score --json sbom-artifacts/*.cdx.json > sbomqs-results.json
          python3 scripts/check_sbom_quality.py \
            --threshold "$SBOM_QUALITY_THRESHOLD" \
            sbomqs-results.json
      - name: Upload machine-readable SBOM evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v4
        with:
          name: sbom-quality-evidence
          path: |
            sbom-artifacts/*.cdx.json
            sbomqs-results.json
          if-no-files-found: error
          retention-days: 14

  cargo-geiger-report:
    name: Cargo Geiger Report
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Rust
        uses: greenbone/actions/setup-rust@d6d4c9500cb4e83f8a516ec1d40b04bcc720bd22 # v3
        with:
          rust-version: stable
          components: rustfmt
          cache-key: cargo-security-geiger-report-${{ runner.os }}-${{ runner.arch }}-stable-${{ env.CARGO_GEIGER_VERSION }}-${{ hashFiles('**/Cargo.lock') }}
      - name: Install pinned cargo-geiger
        run: cargo install cargo-geiger --version "${CARGO_GEIGER_VERSION}" --locked
      - name: Generate every first-party package report
        # The pinned install and setup-rust cache share the default Cargo home. Use
        # clean scan-local state so partial registry trees cannot poison Geiger.
        env:
          CARGO_HOME: ${{ runner.temp }}/cargo-geiger-scan-home
          CARGO_TARGET_DIR: ${{ runner.temp }}/cargo-geiger-scan-target
        run: python3 scripts/check_workspace_unsafe.py --report-only
      - name: Upload Cargo Geiger evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v4
        with:
          name: cargo-geiger-report
          path: target/geiger/*.json
          if-no-files-found: error
          retention-days: 14

  cargo-geiger-workspace-gate:
    name: Cargo Geiger Workspace Gate
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Rust
        uses: greenbone/actions/setup-rust@d6d4c9500cb4e83f8a516ec1d40b04bcc720bd22 # v3
        with:
          rust-version: stable
          components: rustfmt
          cache-key: cargo-security-geiger-gate-${{ runner.os }}-${{ runner.arch }}-stable-${{ env.CARGO_GEIGER_VERSION }}-${{ hashFiles('**/Cargo.lock') }}
      - name: Install pinned cargo-geiger
        run: cargo install cargo-geiger --version "${CARGO_GEIGER_VERSION}" --locked
      - name: Reject unsafe Rust in first-party workspace packages
        env:
          CARGO_HOME: ${{ runner.temp }}/cargo-geiger-scan-home
          CARGO_TARGET_DIR: ${{ runner.temp }}/cargo-geiger-scan-target
        run: python3 scripts/check_workspace_unsafe.py

  semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run immutable direct Semgrep scan
        run: |
          docker run --rm \
            --volume "${GITHUB_WORKSPACE}:/src:ro" \
            --workdir /src \
            semgrep/semgrep:1.176.1@sha256:34ab619bf1391a24bfda3f05debd0d8a6ce3093c2d5f9d39cfc00f83c1397823 \
            semgrep scan \
              --strict \
              --error \
              --config p/rust \
              --config p/security-audit \
              --config p/secrets \
              --sarif > semgrep.sarif
          jq '(.runs[].tool.driver.name) = "Semgrep"' \
            semgrep.sarif > semgrep.normalized.sarif
          mv semgrep.normalized.sarif semgrep.sarif
      - name: Upload SARIF
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v3
        with:
          sarif_file: semgrep.sarif

  security:
    name: Security
    if: ${{ always() }}
    needs:
      - cargo-audit
      - cargo-machete
      - cargo-vet
      - security-policy
      - sbom-quality
      - cargo-geiger-report
      - cargo-geiger-workspace-gate
      - semgrep
    runs-on: ubuntu-latest
    steps:
      - name: Require every security job to succeed
        env:
          CARGO_AUDIT_RESULT: ${{ needs.cargo-audit.result }}
          CARGO_MACHETE_RESULT: ${{ needs.cargo-machete.result }}
          CARGO_VET_RESULT: ${{ needs.cargo-vet.result }}
          SECURITY_POLICY_RESULT: ${{ needs.security-policy.result }}
          SBOM_QUALITY_RESULT: ${{ needs.sbom-quality.result }}
          CARGO_GEIGER_REPORT_RESULT: ${{ needs.cargo-geiger-report.result }}
          CARGO_GEIGER_WORKSPACE_GATE_RESULT: ${{ needs.cargo-geiger-workspace-gate.result }}
          SEMGREP_RESULT: ${{ needs.semgrep.result }}
        run: |
          test "$CARGO_AUDIT_RESULT" = success
          test "$CARGO_MACHETE_RESULT" = success
          test "$CARGO_VET_RESULT" = success
          test "$SECURITY_POLICY_RESULT" = success
          test "$SBOM_QUALITY_RESULT" = success
          test "$CARGO_GEIGER_REPORT_RESULT" = success
          test "$CARGO_GEIGER_WORKSPACE_GATE_RESULT" = success
          test "$SEMGREP_RESULT" = success
