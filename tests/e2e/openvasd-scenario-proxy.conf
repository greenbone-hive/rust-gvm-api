# Test-only fault injector. The happy path connects gvmd directly to
# openvasd-backend:8086; these ports are selected only by the fault harness.
proxy_connect_timeout 5s;
proxy_read_timeout 90s;
proxy_send_timeout 5s;

server { listen 8400; location / { proxy_set_header X-Emulator-Scenario http-400; proxy_pass http://openvasd-backend:8086; } }
server { listen 8500; location / { proxy_set_header X-Emulator-Scenario http-500; proxy_pass http://openvasd-backend:8086; } }
server { listen 8600; location / { proxy_set_header X-Emulator-Scenario malformed-body; proxy_pass http://openvasd-backend:8086; } }
server { listen 8700; location / { proxy_set_header X-Emulator-Scenario malformed-header; proxy_pass http://openvasd-backend:8086; } }
server { listen 8800; location / { proxy_set_header X-Emulator-Scenario timeout; proxy_pass http://openvasd-backend:8086; } }
