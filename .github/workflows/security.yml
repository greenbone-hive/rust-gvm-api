name: Security

on:
  merge_group:
    types: [checks_requested]
  push:
    branches: [main, devel, next]
    paths-ignore:
      - 'docs/**'
      - 'spec/**'
      - '*.md'
      - 'LICENSE'
      - '.github/ISSUE_TEMPLATE/**'
  pull_request:
    branches: [main, devel, next]
  schedule:
    # Run weekly on Monday at 06:00 UTC
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  # Rust advisory database check
  cargo-audit:
    name: Cargo Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
      - name: Install cargo-audit
        run: cargo install cargo-audit
      - name: Run cargo-audit
        run: cargo audit

  # Check for unused dependencies
  cargo-machete:
    name: Unused Dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
      - name: Install cargo-machete
        run: cargo install cargo-machete
      - name: Run cargo-machete
        run: cargo machete

  # Semgrep SAST (static application security testing)
  semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run Semgrep
        run: |
          docker run --rm \
            --volume "${GITHUB_WORKSPACE}:/src:ro" \
            --workdir /src \
            semgrep/semgrep:1.176.1@sha256:34ab619bf1391a24bfda3f05debd0d8a6ce3093c2d5f9d39cfc00f83c1397823 \
            semgrep scan \
              --strict \
              --error \
              --config p/rust \
              --config p/security-audit \
              --config p/secrets \
              --sarif > semgrep.sarif
          jq '(.runs[].tool.driver.name) = "Semgrep"' \
            semgrep.sarif > semgrep.normalized.sarif
          mv semgrep.normalized.sarif semgrep.sarif
      - name: Upload SARIF
        # Code scanning must be enabled for the repo for SARIF upload to work.
        # For private repos, this requires GitHub Advanced Security (GHAS).
        # Making this non-blocking until code scanning is enabled.
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v3
        with:
          sarif_file: semgrep.sarif

  # Aggregator job for branch protection — require this single check
  security:
    name: Security
    if: always()
    needs: [cargo-audit, cargo-machete, semgrep]
    runs-on: ubuntu-latest
    steps:
      - name: Check upstream job results
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" ||
                "${{ contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "One or more upstream jobs failed or were cancelled"
            exit 1
          fi
