openapi: 3.1.0

paths:
  /credential-stores:
    get:
      operationId: getCredentialStores
      tags: [Credentials]
      summary: List available credential stores
      description: Returns backend credential stores that clients may target during credential create/update flows. Backends that do not expose this capability, including versions before GMP 22.8 and instances where gvmd disables `get_credential_stores`, return `501 Not Implemented` because the gateway does not synthesize default store entries.
      responses:
        "200":
          description: Available credential stores
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CredentialStoreList"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "501":
          $ref: "./common.yaml#/components/responses/NotImplemented"
        "502":
          $ref: "./common.yaml#/components/responses/BadGateway"

  /credential-stores/{id}:
    parameters:
      - $ref: "./common.yaml#/components/parameters/ResourceId"
    get:
      operationId: getCredentialStore
      tags: [Credentials]
      summary: Get a credential store
      description: Returns one credential store without exposing backend preference values.
      responses:
        "200":
          description: Credential store details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CredentialStore"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"
        "501":
          $ref: "./common.yaml#/components/responses/NotImplemented"
        "502":
          $ref: "./common.yaml#/components/responses/BadGateway"
    put:
      operationId: modifyCredentialStore
      tags: [Credentials]
      summary: Modify a credential store
      description: Updates credential-store connection settings. Preference values are write-only and never returned.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModifyCredentialStore"
      responses:
        "200":
          description: Credential store updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CredentialStore"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"
        "501":
          $ref: "./common.yaml#/components/responses/NotImplemented"
        "502":
          $ref: "./common.yaml#/components/responses/BadGateway"

  /credential-stores/{id}/actions/verify:
    parameters:
      - $ref: "./common.yaml#/components/parameters/ResourceId"
    post:
      operationId: verifyCredentialStore
      tags: [Credentials]
      summary: Verify a credential store
      description: Asks gvmd to verify the credential-store connection.
      responses:
        "204":
          description: Credential store verified
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"
        "501":
          $ref: "./common.yaml#/components/responses/NotImplemented"
        "502":
          $ref: "./common.yaml#/components/responses/BadGateway"

  /credentials:
    get:
      operationId: getCredentials
      tags: [Credentials]
      summary: List credentials
      parameters:
        - $ref: "./common.yaml#/components/parameters/FilterString"
        - $ref: "./common.yaml#/components/parameters/FilterId"
        - $ref: "./common.yaml#/components/parameters/Page"
        - $ref: "./common.yaml#/components/parameters/PerPage"
      responses:
        "200":
          description: Paginated list of credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CredentialList"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "502":
          $ref: "./common.yaml#/components/responses/BadGateway"
    post:
      operationId: createCredential
      tags: [Credentials]
      summary: Create a credential
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCredential"
      responses:
        "201":
          description: Credential created
          headers:
            Location:
              $ref: "./common.yaml#/components/headers/Location"
          content:
            application/json:
              schema:
                $ref: "./common.yaml#/components/schemas/ResourceCreated"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "502":
          $ref: "./common.yaml#/components/responses/BadGateway"

  /credentials/{id}:
    parameters:
      - $ref: "./common.yaml#/components/parameters/ResourceId"
    get:
      operationId: getCredential
      tags: [Credentials]
      summary: Get a credential
      responses:
        "200":
          description: Credential details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Credential"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "502":
          $ref: "./common.yaml#/components/responses/BadGateway"
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"
    put:
      operationId: modifyCredential
      tags: [Credentials]
      summary: Modify a credential
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModifyCredential"
      responses:
        "200":
          description: Credential updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Credential"
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "502":
          $ref: "./common.yaml#/components/responses/BadGateway"
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"
    delete:
      operationId: deleteCredential
      tags: [Credentials]
      summary: Delete a credential
      description: Deletes a credential. Pass `ultimate=true` to request permanent backend deletion instead of the default non-ultimate delete.
      parameters:
        - $ref: "./common.yaml#/components/parameters/UltimateDelete"
      responses:
        "204":
          description: Credential deleted
        "400":
          $ref: "./common.yaml#/components/responses/BadRequest"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "502":
          $ref: "./common.yaml#/components/responses/BadGateway"
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"

components:
  schemas:
    Credential:
      type: object
      required:
        - id
        - name
        - type
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        comment:
          type: string
        type:
          $ref: "./common.yaml#/components/schemas/CredentialType"
        login:
          type: string
        inUse:
          type: boolean
        writable:
          type: boolean

    CreateCredential:
      type: object
      required:
        - name
        - type
      properties:
        name:
          type: string
        comment:
          type: string
        type:
          $ref: "./common.yaml#/components/schemas/CredentialType"
        login:
          type: string
        password:
          type: string
          format: password
        privateKey:
          type: string
          description: PEM-encoded private key (for `usk` type).
        certificate:
          type: string
          description: PEM-encoded certificate (for `cc` type).
        community:
          type: string
          description: SNMP community string (for `snmp` type).
        authAlgorithm:
          type: string
          enum:
            - md5
            - sha1
          description: SNMP auth algorithm (for `snmpv3` type).
        privacyAlgorithm:
          type: string
          enum:
            - aes
            - des
          description: SNMP privacy algorithm (for `snmpv3` type).
        privacyPassword:
          type: string
          format: password
          description: SNMP privacy password (for `snmpv3` type).
        credentialStoreId:
          type: string
          format: uuid
          description: Credential-store identifier for `cs_*` credential types.
        vaultId:
          type: string
          description: Write-only external vault identifier for `cs_*` credential types.
        hostIdentifier:
          type: string
          description: Write-only external host identifier for `cs_*` credential types.

    ModifyCredential:
      type: object
      properties:
        name:
          type: string
        comment:
          type: string
        login:
          type: string
        password:
          type: string
          format: password
        privateKey:
          type: string
          description: PEM-encoded private key (for `usk` type).
        certificate:
          type: string
          description: PEM-encoded certificate (for `cc` type).
        community:
          type: string
          description: SNMP community string (for `snmp` type).
        authAlgorithm:
          type: string
          enum:
            - md5
            - sha1
          description: SNMP auth algorithm (for `snmpv3` type).
        privacyAlgorithm:
          type: string
          enum:
            - aes
            - des
          description: SNMP privacy algorithm (for `snmpv3` type).
        privacyPassword:
          type: string
          format: password
          description: SNMP privacy password (for `snmpv3` type).
        credentialStoreId:
          type: string
          format: uuid
          description: Credential-store identifier for a store-backed credential.
        vaultId:
          type: string
          description: Write-only external vault identifier for a store-backed credential.
        hostIdentifier:
          type: string
          description: Write-only external host identifier for a store-backed credential.

    CredentialList:
      type: object
      required:
        - data
        - pagination
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Credential"
        pagination:
          $ref: "./common.yaml#/components/schemas/Pagination"

    CredentialStore:
      type: object
      required:
        - name
      properties:
        id:
          type: string
          description: Stable backend identifier for the credential store.
        name:
          type: string
          description: Human-readable credential store name.
        provider:
          type: string
          description: Optional provider or backing implementation label.
        default:
          type: boolean
          description: Whether this is the default store for new credentials.
        writable:
          type: boolean
          description: Whether clients may create or modify credentials in this store.

    CredentialStoreList:
      type: object
      required:
        - data
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/CredentialStore"

    CredentialStorePreference:
      type: object
      required:
        - name
        - value
      properties:
        name:
          type: string
          maxLength: 1024
        value:
          type: string
          format: password
          maxLength: 65536
          description: Write-only credential-store preference value.

    ModifyCredentialStore:
      type: object
      properties:
        active:
          type: boolean
        host:
          type: string
        path:
          type: string
        port:
          type: integer
          minimum: 0
          maximum: 65535
        comment:
          type: string
        preferences:
          type: array
          maxItems: 256
          items:
            $ref: "#/components/schemas/CredentialStorePreference"
