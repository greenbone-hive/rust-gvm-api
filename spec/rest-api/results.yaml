openapi: 3.1.0

paths:
  /results:
    get:
      operationId: getResults
      tags: [Results]
      summary: List results
      parameters:
        - $ref: "./common.yaml#/components/parameters/FilterString"
        - $ref: "./common.yaml#/components/parameters/FilterId"
        - $ref: "./common.yaml#/components/parameters/Page"
        - $ref: "./common.yaml#/components/parameters/PerPage"
      responses:
        "200":
          description: Paginated list of results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResultList"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "502":
          $ref: "./common.yaml#/components/responses/BadGateway"

  /results/{id}:
    parameters:
      - $ref: "./common.yaml#/components/parameters/ResourceId"
    get:
      operationId: getResult
      tags: [Results]
      summary: Get a result
      responses:
        "200":
          description: Result details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Result"
        "401":
          $ref: "./common.yaml#/components/responses/Unauthorized"
        "502":
          $ref: "./common.yaml#/components/responses/BadGateway"
        "404":
          $ref: "./common.yaml#/components/responses/NotFound"

components:
  schemas:
    Result:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          description: NVT name.
        host:
          type: string
        port:
          type: string
        severity:
          type: number
          format: double
        threat:
          type: string
          anyOf:
            - type: string
              enum:
                - High
                - Medium
                - Low
                - Log
                - Alarm
            - type: string
          description: Known values are listed for documentation and client generation. This list is not exhaustive; unknown future values may also be returned verbatim, and clients must preserve them.
        qod:
          $ref: "#/components/schemas/Qod"
        nvt:
          $ref: "#/components/schemas/NvtRef"
        description:
          type: string
        task:
          $ref: "./common.yaml#/components/schemas/ResourceRef"
        report:
          $ref: "./common.yaml#/components/schemas/ResourceRef"
        hostsCount:
          type: integer
          minimum: 0
          description: Number of distinct hosts represented by an aggregate report vulnerability. Omitted for ordinary results and when the backend does not provide an aggregate count.
        occurrences:
          type: integer
          minimum: 0
          description: Number of result occurrences represented by an aggregate report vulnerability. Omitted for ordinary results and when the backend does not provide an aggregate count.

    Qod:
      type: object
      description: Quality of Detection metadata supplied by gvmd. The object and each child field are optional because GMP may omit any of them.
      properties:
        value:
          type: integer
          minimum: 0
          maximum: 100
          description: GMP detection-confidence percentage. Higher values indicate greater confidence that the reported finding was detected correctly.
        type:
          type: string
          description: Backend-defined GMP detection method, such as `remote_vul`. The gateway preserves this open string without normalization.

    NvtRef:
      type: object
      properties:
        oid:
          type: string
        name:
          type: string
        family:
          type: string
        cvssBase:
          type: number
          format: double
        cves:
          type: array
          items:
            type: string
        tags:
          type: string
        typeMetadata:
          type: string
          description: Source-shaped NVT type metadata supplied by gvmd. The gateway preserves this value without parsing or narrowing its schema.
        epss:
          $ref: "#/components/schemas/Epss"

    NvtRefSummary:
      type: object
      properties:
        oid:
          type: string
        name:
          type: string
        family:
          type: string
        cvssBase:
          type: number
          format: double
        cves:
          type: array
          items:
            type: string
        tags:
          type: string
        typeMetadata:
          type: string
          description: Source-shaped NVT type metadata supplied by gvmd. The gateway preserves this value without parsing or narrowing its schema.

    Epss:
      type: object
      required:
        - maxEpss
        - maxSeverity
      properties:
        maxEpss:
          $ref: "#/components/schemas/EpssSelection"
        maxSeverity:
          $ref: "#/components/schemas/EpssSelection"

    EpssSelection:
      type: object
      required:
        - score
        - percentile
        - cve
      properties:
        score:
          type: number
          format: double
          minimum: 0
          maximum: 1
          description: EPSS probability score.
        percentile:
          type: number
          format: double
          minimum: 0
          maximum: 100
          description: EPSS percentile in the backend-native percentage range.
        cve:
          type: string
          description: CVE identifier selected for this EPSS maximum.
        severity:
          type: number
          format: double
          minimum: 0
          maximum: 10
          description: Optional severity of the selected CVE.

    ResultList:
      type: object
      required:
        - data
        - pagination
      properties:
        data:
          type: array
          maxItems: 1000
          items:
            $ref: "#/components/schemas/Result"
        pagination:
          $ref: "./common.yaml#/components/schemas/Pagination"
