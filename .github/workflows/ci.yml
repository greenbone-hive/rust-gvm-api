name: CI

on:
  merge_group:
    types: [checks_requested]
  push:
    branches: [main, devel]
  pull_request:
    branches: [main, devel]

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  CARGO_DENY_VERSION: "0.20.2"
  CARGO_LLVM_COV_VERSION: "0.9.1"

jobs:
  classify-changes:
    name: Classify Changes
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
      ci_required: ${{ steps.classify.outputs.ci_required }}
      target_branch: ${{ steps.classify.outputs.target_branch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Classify changed files
        id: classify
        env:
          TARGET_BRANCH: ${{ github.base_ref || github.event.merge_group.base_ref || github.ref_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: .github/scripts/classify-ci-changes.sh

  fmt:
    name: Format
    needs: classify-changes
    if: needs.classify-changes.outputs.ci_required == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Rust
        uses: greenbone/actions/setup-rust@d6d4c9500cb4e83f8a516ec1d40b04bcc720bd22 # v3
        with:
          rust-version: stable
          components: rustfmt
          cache-key: cargo-ci-fmt-${{ runner.os }}-${{ runner.arch }}-stable-${{ hashFiles('**/Cargo.lock') }}
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    needs: classify-changes
    if: needs.classify-changes.outputs.ci_required == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure git credentials for private deps
        run: git config --global url."https://x-access-token:${{ secrets.RELEASE_TOKEN }}@github.com/".insteadOf "https://github.com/"
      - name: Set up Rust
        uses: greenbone/actions/setup-rust@d6d4c9500cb4e83f8a516ec1d40b04bcc720bd22 # v3
        with:
          rust-version: stable
          components: clippy
          cache-key: cargo-ci-clippy-${{ runner.os }}-${{ runner.arch }}-stable-${{ hashFiles('**/Cargo.lock') }}
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    name: Test (${{ matrix.rust }})
    needs: classify-changes
    if: needs.classify-changes.outputs.ci_required == 'true'
    runs-on: ubuntu-latest
    env:
      # Override rust-toolchain.toml so the MSRV matrix lane really uses 1.89.0.
      RUSTUP_TOOLCHAIN: ${{ matrix.rust }}
    strategy:
      matrix:
        rust: [stable, "1.89.0"]  # stable + MSRV
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configure git credentials for private deps
        run: git config --global url."https://x-access-token:${{ secrets.RELEASE_TOKEN }}@github.com/".insteadOf "https://github.com/"
      - name: Set up Rust
        uses: greenbone/actions/setup-rust@d6d4c9500cb4e83f8a516ec1d40b04bcc720bd22 # v3
        with:
          rust-version: ${{ matrix.rust }}
          components: rustfmt
          cache-key: cargo-ci-test-${{ runner.os }}-${{ runner.arch }}-${{ matrix.rust }}-${{ hashFiles('**/Cargo.lock') }}
      - run: cargo test --workspace

  test-features:
    name: Test (all features)
    needs: classify-changes
    if: needs.classify-changes.outputs.ci_required == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configure git credentials for private deps
        run: git config --global url."https://x-access-token:${{ secrets.RELEASE_TOKEN }}@github.com/".insteadOf "https://github.com/"
      - name: Set up Rust
        uses: greenbone/actions/setup-rust@d6d4c9500cb4e83f8a516ec1d40b04bcc720bd22 # v3
        with:
          rust-version: stable
          components: rustfmt
          cache-key: cargo-ci-test-features-${{ runner.os }}-${{ runner.arch }}-stable-${{ hashFiles('**/Cargo.lock') }}
      - run: cargo test --workspace --all-features

  doc:
    name: Documentation
    needs: classify-changes
    if: needs.classify-changes.outputs.ci_required == 'true'
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: "-Dwarnings"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configure git credentials for private deps
        run: git config --global url."https://x-access-token:${{ secrets.RELEASE_TOKEN }}@github.com/".insteadOf "https://github.com/"
      - name: Set up Rust
        uses: greenbone/actions/setup-rust@d6d4c9500cb4e83f8a516ec1d40b04bcc720bd22 # v3
        with:
          rust-version: stable
          components: rustfmt
          cache-key: cargo-ci-doc-${{ runner.os }}-${{ runner.arch }}-stable-${{ hashFiles('**/Cargo.lock') }}
      - run: cargo doc --workspace --all-features --no-deps

  docs-package:
    name: User Docs Package
    needs: classify-changes
    if: needs.classify-changes.outputs.ci_required == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate documentation navigation and API reference
        run: python3 scripts/check-docs.py
      - name: Build user docs package
        run: ./scripts/build-docs-package.sh --version "$(./scripts/workspace-version.sh)" --output-dir dist/docs
      - name: Verify user docs package structure
        run: |
          shopt -s nullglob
          docs_archives=(dist/docs/rust-gvm-api-docs-*.tar.gz)
          if (( ${#docs_archives[@]} != 1 )); then
            echo "Expected exactly one docs archive, found ${#docs_archives[@]}" >&2
            exit 1
          fi
          archive="${docs_archives[0]}"
          [[ -f "${archive}.sha256" ]] || { echo "Missing checksum for ${archive}" >&2; exit 1; }
          tar tzf "${archive}" | grep -q '/README.md$'
          tar tzf "${archive}" | grep -q '/usage.md$'
          tar tzf "${archive}" | grep -q '/api-reference.md$'
          tar tzf "${archive}" | grep -q '/examples.md$'
          tar tzf "${archive}" | grep -q '/migration.md$'
          tar tzf "${archive}" | grep -q '/examples/scan-target.sh$'
          tar tzf "${archive}" | grep -q '/examples/import-users.sh$'
          tar tzf "${archive}" | grep -q '/examples/users.csv$'
          tar tzf "${archive}" | grep -q '/container-config.example.toml$'
          tar tzf "${archive}" | grep -q '/package-config.example.toml$'
          tar tzf "${archive}" | grep -q '/api/rest/openapi.yaml$'

  deny:
    name: Cargo Deny
    needs: classify-changes
    if: needs.classify-changes.outputs.ci_required == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configure git credentials for private deps
        run: git config --global url."https://x-access-token:${{ secrets.RELEASE_TOKEN }}@github.com/".insteadOf "https://github.com/"
      - name: Set up Rust
        uses: greenbone/actions/setup-rust@d6d4c9500cb4e83f8a516ec1d40b04bcc720bd22 # v3
        with:
          rust-version: stable
          components: rustfmt
          cache-key: cargo-ci-deny-${{ runner.os }}-${{ runner.arch }}-stable-${{ env.CARGO_DENY_VERSION }}-${{ hashFiles('**/Cargo.lock') }}
      - name: Install pinned cargo-deny
        run: cargo install cargo-deny --version "${CARGO_DENY_VERSION}" --locked
      - name: Run cargo-deny
        run: cargo deny --workspace check

  coverage:
    name: Coverage
    needs: classify-changes
    if: needs.classify-changes.outputs.ci_required == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configure git credentials for private deps
        run: git config --global url."https://x-access-token:${{ secrets.RELEASE_TOKEN }}@github.com/".insteadOf "https://github.com/"
      - name: Set up Rust
        uses: greenbone/actions/setup-rust@d6d4c9500cb4e83f8a516ec1d40b04bcc720bd22 # v3
        with:
          rust-version: stable
          components: llvm-tools-preview
          cache-key: cargo-ci-coverage-${{ runner.os }}-${{ runner.arch }}-stable-${{ env.CARGO_LLVM_COV_VERSION }}-${{ hashFiles('**/Cargo.lock') }}
      - name: Install pinned cargo-llvm-cov
        run: cargo install cargo-llvm-cov --version "${CARGO_LLVM_COV_VERSION}" --locked
      - run: cargo llvm-cov --workspace --all-features --lcov --output-path lcov.info
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v5
        with:
          files: lcov.info
          fail_ci_if_error: false

  msrv:
    name: MSRV Check
    needs: classify-changes
    if: needs.classify-changes.outputs.ci_required == 'true'
    runs-on: ubuntu-latest
    env:
      # Override the repository's stable rust-toolchain.toml for this gate.
      RUSTUP_TOOLCHAIN: "1.89.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configure git credentials for private deps
        run: git config --global url."https://x-access-token:${{ secrets.RELEASE_TOKEN }}@github.com/".insteadOf "https://github.com/"
      - name: Set up Rust
        uses: greenbone/actions/setup-rust@d6d4c9500cb4e83f8a516ec1d40b04bcc720bd22 # v3
        with:
          rust-version: "1.89.0"
          components: rustfmt
          cache-key: cargo-ci-msrv-${{ runner.os }}-${{ runner.arch }}-1.89.0-${{ hashFiles('**/Cargo.lock') }}
      - run: cargo check --workspace --all-features

  package:
    name: Package (${{ matrix.packager }}, ${{ matrix.package_arch }})
    needs: classify-changes
    if: needs.classify-changes.outputs.ci_required == 'true'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - packager: deb
            package_arch: amd64
            runner: ubuntu-latest
          - packager: archlinux
            package_arch: x86_64
            runner: ubuntu-latest
          - packager: deb
            package_arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configure git credentials for private deps
        run: git config --global url."https://x-access-token:${{ secrets.RELEASE_TOKEN }}@github.com/".insteadOf "https://github.com/"
      - name: Set up Rust
        uses: greenbone/actions/setup-rust@d6d4c9500cb4e83f8a516ec1d40b04bcc720bd22 # v3
        with:
          rust-version: stable
          components: rustfmt
          cache-key: cargo-ci-package-${{ matrix.packager }}-${{ matrix.package_arch }}-${{ runner.os }}-${{ runner.arch }}-stable-${{ hashFiles('**/Cargo.lock') }}
      - name: Build release binary
        run: cargo build --locked --release -p gvm-gateway
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Build package
        run: ./scripts/package-build.sh --packager "${{ matrix.packager }}" --architecture "${{ matrix.package_arch }}" --version "$(./scripts/workspace-version.sh)" --output-dir dist/packages
      - name: Smoke test package install
        run: ./scripts/package-smoke.sh --packager "${{ matrix.packager }}" --package-dir dist/packages
      - name: Upload package artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: gvm-gateway-${{ matrix.packager }}-${{ matrix.package_arch }}
          path: dist/packages/*

  container:
    name: Container
    needs: classify-changes
    if: needs.classify-changes.outputs.ci_required == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
        with:
          driver: docker-container
      - run: docker buildx version
      - name: Build loadable runtime image
        run: |
          docker buildx build \
            --load \
            --build-arg "GVM_GATEWAY_VERSION=$(./scripts/workspace-version.sh)" \
            --build-arg "GVM_GATEWAY_VCS_REF=$(git rev-parse HEAD)" \
            -t local/gvm-gateway:ci \
            -f Containerfile \
            .
      - name: Smoke test runtime image
        run: docker run --rm local/gvm-gateway:ci --help >/tmp/gvm-gateway-help.txt
      - name: Validate compose stack
        run: docker compose -f compose.yaml config >/tmp/gvm-gateway-compose.yaml
      - name: Export OCI archive artifact
        run: |
          mkdir -p dist/oci
          docker buildx build \
            --output type=oci,dest=dist/oci/gvm-gateway.oci.tar \
            --build-arg "GVM_GATEWAY_VERSION=$(./scripts/workspace-version.sh)" \
            --build-arg "GVM_GATEWAY_VCS_REF=$(git rev-parse HEAD)" \
            -f Containerfile \
            .
          sha256sum dist/oci/gvm-gateway.oci.tar > dist/oci/gvm-gateway.oci.tar.sha256
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: gvm-gateway-oci
          path: dist/oci/*

  # Aggregator job for branch protection — require this single check
  ci:
    name: CI
    if: always()
    needs: [classify-changes, fmt, clippy, test, test-features, doc, docs-package, deny, coverage, msrv, package, container]
    runs-on: ubuntu-latest
    steps:
      - name: Summarize docs-only decision
        run: |
          echo "docs_only=${{ needs.classify-changes.outputs.docs_only }}"
          echo "ci_required=${{ needs.classify-changes.outputs.ci_required }}"
          echo "target_branch=${{ needs.classify-changes.outputs.target_branch }}"
      - name: Check upstream job results
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" ||
                "${{ contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "One or more upstream jobs failed or were cancelled"
            exit 1
          fi
